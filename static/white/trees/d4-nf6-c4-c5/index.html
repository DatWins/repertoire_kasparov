<div id="hint">Scroll or pinch to zoom · drag to move · double-click to zoom in</div>
<script>
(function(){
  const stage=document.getElementById('stage'), img=document.getElementById('tree'), label=document.getElementById('zoomLabel');
  let scale=1, x=0, y=0, minScale=0.05, maxScale=3;
  function apply(){ img.style.transform=`translate(${x}px,${y}px) scale(${scale})`; label.textContent=Math.round(scale*100)+'%'; }
  function zoomAt(f,cx,cy){ const ns=Math.min(maxScale,Math.max(minScale,scale*f)); f=ns/scale;
    x=cx-(cx-x)*f; y=cy-(cy-y)*f; scale=ns; apply(); }
  function fit(){ const w=stage.clientWidth,h=stage.clientHeight; scale=Math.min(w/img.naturalWidth,h/img.naturalHeight)*0.98;
    minScale=scale*0.5; x=(w-img.naturalWidth*scale)/2; y=(h-img.naturalHeight*scale)/2; apply(); }
  function center(){ return [stage.clientWidth/2, stage.clientHeight/2]; }
  img.complete ? fit() : img.addEventListener('load',fit);
  window.addEventListener('resize',fit);
  stage.addEventListener('wheel',e=>{ e.preventDefault(); const r=stage.getBoundingClientRect();
    zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top); },{passive:false});
  stage.addEventListener('dblclick',e=>{ const r=stage.getBoundingClientRect(); zoomAt(2,e.clientX-r.left,e.clientY-r.top); });
  const pts=new Map(); let lastDist=0;
  stage.addEventListener('pointerdown',e=>{ stage.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]); stage.classList.add('dragging'); });
  stage.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; const prev=pts.get(e.pointerId);
    pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===1){ x+=e.clientX-prev[0]; y+=e.clientY-prev[1]; apply(); }
    else if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
      const r=stage.getBoundingClientRect(); if(lastDist) zoomAt(d/lastDist,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top); lastDist=d; } });
  function up(e){ pts.delete(e.pointerId); lastDist=0; if(!pts.size) stage.classList.remove('dragging'); }
  stage.addEventListener('pointerup',up); stage.addEventListener('pointercancel',up);
  document.getElementById('in').onclick=()=>zoomAt(1.4,...center());
  document.getElementById('out').onclick=()=>zoomAt(1/1.4,...center());
  document.getElementById('fit').onclick=fit;
  document.getElementById('actual').onclick=()=>{ const [cx,cy]=center(); zoomAt(1/scale,cx,cy); };
  setTimeout(()=>{ document.getElementById('hint').style.opacity=0; },5000);
})();
</script>
